name: Testes

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test