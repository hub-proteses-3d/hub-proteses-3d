<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo parceiro - Hub AACD</title>
  <link rel="stylesheet" href="css/variaveis.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/admin-formulario.css">
</head>
<body>
  <header class="topbar">
    <a href="admin-usuarios.html" class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Hub AACD</span>
    </a>
    <nav class="nav">
      <a href="admin-usuarios.html">Usuários</a>
      <a href="admin-parceiros.html" class="active">Parceiros</a>
    </nav>
    <div class="user-chip">
      <span class="avatar"></span>
      <span class="user-name">Mauá · Administrador</span>
      <a href="alterar-senha.html" class="logout-link">Alterar senha</a>
      <button type="button" id="sair" class="logout-link">Sair</button>
    </div>
  </header>

  <main class="content">
    <div class="form-pagina">
      <a href="admin-parceiros.html" class="back-link">← Voltar para parceiros</a>
      <h1 class="page-title">Novo parceiro</h1>
      <p class="page-subtitle">Cadastre a unidade antes de criar os usuários dela</p>

      <form id="form-parceiro" class="card card-pad form-card">
        <div class="form-grid">
          <div class="field full">
            <label for="nome">Nome da unidade</label>
            <input type="text" id="nome" placeholder="Ex: FabLab USCS" required>
          </div>
          <div class="field">
            <label for="tipoUnidade">Tipo de unidade</label>
            <select id="tipoUnidade">
              <option value="fablab">FabLab ou universidade</option>
              <option value="voluntario">Voluntário</option>
              <option value="empresa">Empresa</option>
            </select>
            <p class="dica">FabLab ou universidade, voluntário ou empresa</p>
          </div>
          <div class="field">
            <label for="cidade">Cidade</label>
            <select id="cidade" required>
              <option value="">Escolha a cidade</option>
              <option>Santo André</option>
              <option>São Bernardo do Campo</option>
              <option>São Caetano do Sul</option>
              <option>Diadema</option>
              <option>Mauá</option>
              <option>Ribeirão Pires</option>
              <option>Rio Grande da Serra</option>
              <option>São Paulo</option>
            </select>
          </div>
          <div class="field">
            <label for="cnpj">CNPJ (opcional)</label>
            <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
            <p class="dica">Voluntário não tem CNPJ.</p>
          </div>
          <div class="field">
            <label for="capacidadeMensal">Capacidade de produção</label>
            <input type="number" id="capacidadeMensal" placeholder="Ex: 22 peças por mês" min="0" step="1" required>
          </div>
          <div class="field full">
            <label for="biocompatibilidadeValidada">Certificação de biocompatibilidade</label>
            <select id="biocompatibilidadeValidada">
              <option value="false">Não validada</option>
              <option value="true">Validada</option>
            </select>
          </div>
          <div class="field full">
            <label for="homologado">Situação da homologação</label>
            <select id="homologado">
              <option value="false">Em análise</option>
              <option value="true">Homologado</option>
            </select>
            <p class="dica">Em análise ou Homologado</p>
          </div>
        </div>

        <p id="mensagem" class="mensagem-erro" hidden></p>

        <div class="form-botoes">
          <a href="admin-parceiros.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Criar parceiro</button>
        </div>
      </form>
    </div>
  </main>
  <script src="js/sessao.js"></script>
  <script src="js/admin-novo-parceiro.js"></script>
</body>
</html>
