<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parceiros - Hub AACD</title>
  <link rel="stylesheet" href="css/variaveis.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="topbar">
    <a href="admin-usuarios.html" class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Hub AACD</span>
    </a>
    <nav class="nav">
      <a href="admin-usuarios.html">Usuários</a>
      <a href="admin-parceiros.html" class="active">Parceiros</a>
    </nav>
    <div class="user-chip">
      <span class="avatar"></span>
      <span class="user-name">Mauá · Administrador</span>
      <a href="alterar-senha.html" class="logout-link">Alterar senha</a>
      <button type="button" id="sair" class="logout-link">Sair</button>
    </div>
  </header>

  <main class="content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Parceiros</h1>
        <p class="page-subtitle">Unidades de produção cadastradas pela administração</p>
      </div>
      <a href="admin-novo-parceiro.html" class="btn btn-primary">+ Novo parceiro</a>
    </div>

    <div class="card card-tabela">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Tipo de unidade</th>
            <th>Cidade</th>
            <th>CNPJ</th>
            <th>Homologação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-parceiros">
        </tbody>
      </table>
    </div>
  </main>
  <script src="js/sessao.js"></script>
  <script src="js/admin-parceiros.js"></script>
</body>
</html>
